name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_project_environments:
        description: Download and verify real .NET and Rust SDKs and build disposable fixture projects
        type: boolean
        default: false
      run_lxc:
        description: Create and delete a real test LXC on the dedicated Proxmox lab runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Reviewed minor version; setup-python supplies its current patch release.
  CI_PRIMARY_PYTHON: '3.12'

# Only PR runs supersede one another. Unique groups preserve every push/manual
# run, including release publication and provisioning/cleanup sequences.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Add feature regressions to discovered suites, not new feature-specific jobs.
# Separate jobs represent a different runtime, trust boundary or real install.
jobs:
  checks:
    name: Installer and gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned primary Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.CI_PRIMARY_PYTHON }}
      - name: Check the primary Python runtime against the project declaration
        run: |
          echo "HERDR_CHECK_REPORT=$RUNNER_TEMP/ci-checks.jsonl" >> "$GITHUB_ENV"
          python3 scripts/ci.py runtime
      - name: Bash syntax and mock tests
        shell: bash
        run: |
          git ls-files -z -- '*.sh' > "$RUNNER_TEMP/shell-scripts"
          while IFS= read -r -d '' script; do bash -n "$script"; done < "$RUNNER_TEMP/shell-scripts"
          python3 scripts/check-evidence.py host-fixtures bash tests/host.sh
          python3 scripts/check-evidence.py web-build-fixtures bash tests/build-web.sh
          python3 scripts/check-evidence.py agent-fixtures bash tests/agents.sh
          python3 scripts/check-evidence.py proxmox-fixtures bash tests/proxmox-ci.sh
      - name: Python compile and gateway tests
        run: |
          python3 scripts/check-evidence.py python-compile python3 -m compileall -q web/gateway scripts tests
          python3 scripts/check-evidence.py gateway-tests python3 scripts/test-project-discovery.py --all
      - name: Lint GitHub workflow definitions
        run: python3 scripts/check-evidence.py workflow-lint go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/ci.yml
      - name: Summarize measured check times
        if: always()
        run: python3 scripts/ci.py summarize --report "$HERDR_CHECK_REPORT" --summary "$GITHUB_STEP_SUMMARY" --label 'Installer and gateway checks'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-check-timings
          path: ${{ env.HERDR_CHECK_REPORT }}
          if-no-files-found: warn
          retention-days: 7

  python-compatibility:
    name: Minimum supported Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap runtime selection with the pinned primary Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.CI_PRIMARY_PYTHON }}
      - name: Select the minimum runtime from pyproject.toml
        id: runtime
        run: |
          echo "HERDR_CHECK_REPORT=$RUNNER_TEMP/ci-checks.jsonl" >> "$GITHUB_ENV"
          python3 scripts/ci.py runtime --select-only --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: steps.runtime.outputs.compatibility_needed == 'true'
        with:
          python-version: ${{ steps.runtime.outputs.minimum }}
      - name: Verify the complete discovered suite on the minimum runtime
        if: steps.runtime.outputs.compatibility_needed == 'true'
        run: |
          python scripts/check-evidence.py python-compile python -m compileall -q web/gateway scripts tests
          python scripts/check-evidence.py gateway-tests python scripts/test-project-discovery.py --all
      - name: Minimum runtime already covered by the primary job
        if: steps.runtime.outputs.compatibility_needed == 'false'
        run: echo 'The primary job runs this Python version; no duplicate suite is needed.'
      - name: Summarize measured compatibility times
        if: always() && steps.runtime.outputs.compatibility_needed == 'true'
        run: python3 scripts/ci.py summarize --report "$HERDR_CHECK_REPORT" --summary "$GITHUB_STEP_SUMMARY" --label 'Minimum supported Python checks'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.runtime.outputs.compatibility_needed == 'true'
        with:
          name: python-compatibility-timings
          path: ${{ env.HERDR_CHECK_REPORT }}
          if-no-files-found: warn
          retention-days: 7

  project-environments:
    name: Real project SDK preparation
    needs: [checks, python-compatibility]
    # The exact release commit must pass clean-host SDK qualification before publication.
    if: (github.event_name == 'workflow_dispatch' && inputs.run_project_environments) || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/alpha/') && startsWith(github.event.head_commit.message, 'alpha:'))))
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify publisher archives, contextual SDK selection and real builds
        run: python3 tests/ci/project_environments.py
      - name: Qualify pinned Python and per-execution locked dependency restoration
        run: python3 tests/ci/python_environment.py
      - name: Qualify automatic admission and binding against the pinned real Herdr daemon
        run: python3 tests/ci/live_environment.py

  web:
    name: Jaspr release and preserved bloc checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project's declared Flutter from its official repository
        shell: bash
        run: |
          echo "HERDR_CHECK_REPORT=$RUNNER_TEMP/ci-checks.jsonl" >> "$GITHUB_ENV"
          # .fvmrc is the single source of the version. Pinning it here too
          # would be a second copy to forget when the project moves.
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache Dart package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: dart-linux-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('web/**/pubspec.lock') }}
          restore-keys: dart-linux-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-
      - name: Validate preserved Flutter contracts and build Jaspr dashboard
        run: bash scripts/build-web.sh
      - name: Analyze all repository package contexts
        run: python3 scripts/check-evidence.py repository-analysis dart analyze
      - name: Verify native DOM workflows in Chrome
        working-directory: web/jaspr_dashboard
        # Focus and requestAnimationFrame checks share one browser viewport.
        run: python3 ../../scripts/check-evidence.py browser-tests dart test --platform chrome --concurrency=1
      - name: Verify trusted keyboard navigation and responsive native dialogs
        working-directory: web/jaspr_dashboard
        run: python3 ../../scripts/check-evidence.py native-navigation dart run tool/check_native_navigation.dart
      - name: Verify request IDs in compiled JavaScript
        working-directory: web/dashboard
        run: |
          python3 ../../scripts/check-evidence.py request-id-compile dart compile js test/request_id_web_check.dart -O2 -o "$RUNNER_TEMP/request-id-check.js"
          python3 ../../scripts/check-evidence.py request-id-runtime node -e 'globalThis.self=globalThis; globalThis.crypto=require("node:crypto").webcrypto; require(process.argv[1])' "$RUNNER_TEMP/request-id-check.js"
      - name: Summarize measured web check times
        if: always()
        run: python3 scripts/ci.py summarize --report "$HERDR_CHECK_REPORT" --summary "$GITHUB_STEP_SUMMARY" --label 'Web build and browser checks'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-check-timings
          path: ${{ env.HERDR_CHECK_REPORT }}
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: web/public/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish installable dashboard release
    needs: [checks, python-compatibility, web, project-environments]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/alpha/') && startsWith(github.event.head_commit.message, 'alpha:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Select release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/alpha/* ]]; then
            python3 scripts/alpha-release.py
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo 'RELEASE_CHANNEL=stable' >> "$GITHUB_ENV"
          fi
      - name: Package matching installer, gateway and compiled UI
        run: |
          mkdir -p "$RUNNER_TEMP/package/herdr-proxmox/web"
          cp -R ct install "$RUNNER_TEMP/package/herdr-proxmox/"
          cp README.md .fvmrc "$RUNNER_TEMP/package/herdr-proxmox/"
          printf '%s\n' "$RELEASE_TAG" > "$RUNNER_TEMP/package/herdr-proxmox/VERSION"
          python3 -c 'import json,os,sys; from pathlib import Path; Path(sys.argv[1]).write_text(json.dumps(dict(build_id=os.environ["RELEASE_TAG"], source_sha=os.environ["GITHUB_SHA"], package_version=os.environ["RELEASE_TAG"], deployment_mode="release", channel=os.environ["RELEASE_CHANNEL"], source_branch=os.environ["GITHUB_REF_NAME"] if os.environ["RELEASE_CHANNEL"] == "alpha" else None)))' "$RUNNER_TEMP/package/herdr-proxmox/BUILD.json"
          cp -R web/gateway web/public "$RUNNER_TEMP/package/herdr-proxmox/web/"
          tar -czf herdr-proxmox.tar.gz -C "$RUNNER_TEMP/package" herdr-proxmox
          sha256sum herdr-proxmox.tar.gz > herdr-proxmox.tar.gz.sha256
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_CHANNEL" == alpha ]]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "$RELEASE_TAG" --notes "Testing build from $GITHUB_REF_NAME at $GITHUB_SHA."
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
            fi
          fi
          existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in herdr-proxmox.tar.gz herdr-proxmox.tar.gz.sha256; do
            if grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "Release already contains $asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

  debian-install:
    name: Real Debian provisioning smoke
    needs: [checks, python-compatibility, web]
    # Execute vendor installers on the trusted default branch, never on PR jobs.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Daily APT cache generation
        id: apt-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Debian package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/apt/*.deb
          key: apt-debian13-${{ runner.arch }}-${{ hashFiles('install/*.sh', 'tests/ci/Dockerfile') }}-${{ steps.apt-date.outputs.day }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-${{ hashFiles('install/*.sh', 'tests/ci/Dockerfile') }}-
            apt-debian13-${{ runner.arch }}-
      - name: Set up the cached baseline builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the Debian systemd baseline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/ci
          file: tests/ci/Dockerfile
          tags: herdr-ci-systemd:latest
          load: true
          push: false
          pull: true
          cache-from: type=gha,version=2,scope=herdr-debian13-baseline
          cache-to: type=gha,version=2,scope=herdr-debian13-baseline,mode=max
      - name: Provision Debian 13 and smoke-test the installed services
        run: bash scripts/debian-ci.sh
      - name: Upload provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-smoke-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7

  proxmox-lxc:
    name: Real Proxmox LXC install and smoke
    needs: [checks, web, debian-install]
    if: github.event_name == 'workflow_dispatch' && inputs.run_lxc && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, proxmox-ci]
    environment: proxmox-ci
    timeout-minutes: 60
    concurrency:
      group: proxmox-ci-${{ github.repository }}
      cancel-in-progress: false
    env:
      PVE_TEMPLATE: ${{ vars.PVE_TEMPLATE }}
      PVE_STORAGE: ${{ vars.PVE_STORAGE }}
      PVE_BRIDGE: ${{ vars.PVE_BRIDGE }}
      PVE_IP: ${{ vars.PVE_IP }}
      PVE_GATEWAY: ${{ vars.PVE_GATEWAY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Create, provision and test an owned disposable LXC
        shell: bash
        run: |
          sudo -n /usr/local/sbin/herdr-proxmox-ci run "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/herdr-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.state" "$GITHUB_WORKSPACE/ci-results" \
            "$PVE_TEMPLATE" "$PVE_STORAGE" "${PVE_BRIDGE:-}" "${PVE_IP:-}" "${PVE_GATEWAY:-}"
      - name: Verify cleanup even after an interrupted install
        if: always()
        shell: bash
        run: |
          sudo -n /usr/local/sbin/herdr-proxmox-ci cleanup "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/herdr-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.state" "$GITHUB_WORKSPACE/ci-results" \
            "$PVE_TEMPLATE" "$PVE_STORAGE" "${PVE_BRIDGE:-}" "${PVE_IP:-}" "${PVE_GATEWAY:-}"
      - name: Upload LXC diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxmox-lxc-smoke-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
