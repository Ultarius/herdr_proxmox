name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_lxc:
        description: Create and delete a real test LXC on the dedicated Proxmox lab runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Installer and gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax and mock tests
        shell: bash
        run: |
          git ls-files -z -- '*.sh' > "$RUNNER_TEMP/shell-scripts"
          while IFS= read -r -d '' script; do bash -n "$script"; done < "$RUNNER_TEMP/shell-scripts"
          bash tests/host.sh
          bash tests/build-web.sh
          bash tests/agents.sh
          bash tests/proxmox-ci.sh
      - name: Python compile and gateway tests
        run: |
          python3 -m compileall -q web/gateway tests/ci
          python3 -m unittest discover -s tests
      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Lint GitHub workflow definitions
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/ci.yml

  web:
    name: Pinned Flutter and Jaspr release build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flutter 3.44.8 from its official repository
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache Dart package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: dart-linux-${{ runner.arch }}-3.44.8-${{ hashFiles('web/**/pubspec.lock') }}
          restore-keys: dart-linux-${{ runner.arch }}-3.44.8-
      - name: Analyze, test and build both web applications
        run: bash scripts/build-web.sh
      - name: Verify request IDs in compiled JavaScript
        working-directory: web/dashboard
        run: |
          dart compile js test/request_id_web_check.dart -O2 -o "$RUNNER_TEMP/request-id-check.js"
          node -e 'globalThis.self=globalThis; globalThis.crypto=require("node:crypto").webcrypto; require(process.argv[1])' "$RUNNER_TEMP/request-id-check.js"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: web/public/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish installable dashboard release
    needs: [checks, web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Package matching installer, gateway and compiled UI
        run: |
          mkdir -p "$RUNNER_TEMP/package/herdr-proxmox/web"
          cp -R ct install "$RUNNER_TEMP/package/herdr-proxmox/"
          cp README.md "$RUNNER_TEMP/package/herdr-proxmox/"
          printf '%s\n' '${{ github.ref_name }}' > "$RUNNER_TEMP/package/herdr-proxmox/VERSION"
          python3 -c 'import json,os,sys; from pathlib import Path; Path(sys.argv[1]).write_text(json.dumps(dict(build_id=os.environ["GITHUB_REF_NAME"], source_sha=os.environ["GITHUB_SHA"], package_version=os.environ["GITHUB_REF_NAME"], deployment_mode="release")))' "$RUNNER_TEMP/package/herdr-proxmox/BUILD.json"
          cp -R web/gateway web/public "$RUNNER_TEMP/package/herdr-proxmox/web/"
          tar -czf herdr-proxmox.tar.gz -C "$RUNNER_TEMP/package" herdr-proxmox
          sha256sum herdr-proxmox.tar.gz > herdr-proxmox.tar.gz.sha256
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in herdr-proxmox.tar.gz herdr-proxmox.tar.gz.sha256; do
            if grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "Release already contains $asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

  debian-install:
    name: Real Debian provisioning smoke
    needs: [checks, web]
    # Execute vendor installers on the trusted default branch, never on PR jobs.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Daily APT cache generation
        id: apt-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Debian package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/apt/*.deb
          key: apt-debian13-${{ runner.arch }}-${{ hashFiles('install/*.sh', 'tests/ci/Dockerfile') }}-${{ steps.apt-date.outputs.day }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-${{ hashFiles('install/*.sh', 'tests/ci/Dockerfile') }}-
            apt-debian13-${{ runner.arch }}-
      - name: Set up the cached baseline builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the Debian systemd baseline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/ci
          file: tests/ci/Dockerfile
          tags: herdr-ci-systemd:latest
          load: true
          push: false
          pull: true
          cache-from: type=gha,version=2,scope=herdr-debian13-baseline
          cache-to: type=gha,version=2,scope=herdr-debian13-baseline,mode=max
      - name: Provision Debian 13 and smoke-test the installed services
        run: bash scripts/debian-ci.sh
      - name: Upload provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-smoke-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7

  proxmox-lxc:
    name: Real Proxmox LXC install and smoke
    needs: [checks, web, debian-install]
    if: github.event_name == 'workflow_dispatch' && inputs.run_lxc && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, proxmox-ci]
    environment: proxmox-ci
    timeout-minutes: 60
    concurrency:
      group: proxmox-ci-${{ github.repository }}
      cancel-in-progress: false
    env:
      PVE_TEMPLATE: ${{ vars.PVE_TEMPLATE }}
      PVE_STORAGE: ${{ vars.PVE_STORAGE }}
      PVE_BRIDGE: ${{ vars.PVE_BRIDGE }}
      PVE_IP: ${{ vars.PVE_IP }}
      PVE_GATEWAY: ${{ vars.PVE_GATEWAY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: web/public/
      - name: Create, provision and test an owned disposable LXC
        shell: bash
        run: |
          sudo -n /usr/local/sbin/herdr-proxmox-ci run "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/herdr-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.state" "$GITHUB_WORKSPACE/ci-results" \
            "$PVE_TEMPLATE" "$PVE_STORAGE" "${PVE_BRIDGE:-}" "${PVE_IP:-}" "${PVE_GATEWAY:-}"
      - name: Verify cleanup even after an interrupted install
        if: always()
        shell: bash
        run: |
          sudo -n /usr/local/sbin/herdr-proxmox-ci cleanup "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/herdr-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.state" "$GITHUB_WORKSPACE/ci-results" \
            "$PVE_TEMPLATE" "$PVE_STORAGE" "${PVE_BRIDGE:-}" "${PVE_IP:-}" "${PVE_GATEWAY:-}"
      - name: Upload LXC diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxmox-lxc-smoke-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
